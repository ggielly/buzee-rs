[package]
name = "buzee"
version = "0.2.1"
description = "Find your documents, effortlessly"
authors = ["Guillaume Gielly, Gurjot Sidhu"]
license = "MIT"
edition = "2024"
#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
[features]
default = ["ocr"]
ocr = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
[dependencies]
iced = { version = "0.14.0", features = ["tokio", "advanced", "canvas", "svg"] }
iced_table = "0.14"
plotters = "0.3"
plotters-iced2 = "0.14"
rfd = "0.15"
global-hotkey = "0.5"
crossbeam-channel = "0.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
open = "5.1.1"
dirs = "5.0.1"
diesel = { version = "2.1.4", features = ["sqlite", "r2d2", "chrono", "time"] }
chrono = "0.4.26"
ignore = "0.4"
dotext = "0.1.1"
log = "0.4.21"
log4rs = "1.3"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3"
epub = "2.1.1"
mobi = "0.8.0"
base64 = "0.21"
pdf-extract = "0.12.0"
xml-rs = "0.8.20"
tantivy = "0.22.0"
csv = "1.3.0"
sha2 = "0.10"
toml = "1.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = "0.2"

#═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
# Native Windows OCR (Windows.Media.Ocr via WinRT). Only compiled on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Data_Pdf",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_System_Com"
] }